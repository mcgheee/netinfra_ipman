netinfra_path: ./examples/NetInfra.yml
config_path: ./ipman-config.yml
admin_file: ./ipman-admin.yml
audit_log_file: ./ipman-audit.log
audit_to_file: true
audit_to_syslog: false
audit_max_bytes: 10485760
audit_backup_count: 5
sqlite_path: ./ipman.sqlite3
completed_job_retention: 100
scan_concurrency: 128
ping_timeout: 1.0
dns_timeout: 2.0
dns_lifetime: 2.0
dns_servers: []
# Optional scanner resolver overrides by canonical IPv4 CIDR, most specific first.
# These are independent of NetInfra DHCP DNS options.
subnet_dns_servers: {}
large_subnet_prefix: 24
max_subnet_prefix: 16
git_enabled: false
git_repo_path: .
git_branch: main
git_push: false
git_remote: origin
session_timeout_minutes: 60
lockout_attempts: 5
lockout_minutes: 15
# Anonymous browsing is opt-in. Serve HTTPS before enabling browser sessions.
allow_anonymous_viewing: false
session_cookie_secure: true
# Trust only the immediate proxy addresses/CIDRs you operate; never a public catch-all.
trusted_proxies: []
# Generic OIDC authorization-code login with PKCE; configure real provider values.
oidc_enabled: false
oidc_issuer: ""
oidc_client_id: ""
# Empty is valid for public PKCE clients. Protect this file if a secret is configured.
oidc_client_secret: ""
oidc_redirect_uri: ""
oidc_groups_claim: groups
oidc_roles_claim: roles
# Claim values map to viewer, editor, or administrator. Unmapped users are denied.
oidc_group_role_map: {}
oidc_claim_role_map: {}
