netinfra_path: ./examples/NetInfra.yml
config_path: ./ipman-config.yml
admin_file: ./ipman-admin.yml
audit_log_file: ./ipman-audit.log
audit_to_file: true
audit_to_syslog: false
redis_url: redis://localhost:6379/0
scan_concurrency: 128
ping_timeout: 1.0
dns_timeout: 2.0
dns_lifetime: 2.0
dns_servers: []
large_subnet_prefix: 24
max_subnet_prefix: 16
git_enabled: false
git_repo_path: .
git_branch: main
git_push: false
git_remote: origin
session_timeout_minutes: 60
lockout_attempts: 5
lockout_minutes: 15
rate_limit_per_minute: 60
keycloak_enabled: false
keycloak_metadata_url: ""
keycloak_client_id: ""
keycloak_client_secret: ""
duo_enabled: false
duo_integration_key: ""
duo_secret_key: ""
duo_api_hostname: ""
tls_enabled: false
reverse_proxy: true
