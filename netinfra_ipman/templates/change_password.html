{% extends "base.html" %}
{% block content %}
<h2>Change password</h2>
{% if user.must_change_password %}<p>You must change the emergency administrator password before accessing the application.</p>{% endif %}
{% if error %}<div class="banner error">{{ error }}</div>{% endif %}
<form method="post" action="/change-password" class="stack">
  <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
  <label>Current password <input name="current_password" type="password" autocomplete="current-password" required></label>
  <label>New password (at least 12 characters) <input name="password" type="password" autocomplete="new-password" minlength="12" required></label>
  <label>Confirm new password <input name="confirm_password" type="password" autocomplete="new-password" minlength="12" required></label>
  <button>Update password</button>
</form>
{% endblock %}
