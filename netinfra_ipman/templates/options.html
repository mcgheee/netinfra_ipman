{% extends "base.html" %}
{% block content %}
<h2>Administrator options</h2>
<p>Secrets are never rendered or accepted here. Change secrets and restart-only fields in the protected configuration file, then restart the application.</p>
<form method="post" action="/options" class="options-grid">
  <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
  {% for key, value in settings.items() %}
    <label>{{ key }}{% if key in restart_fields %} (restart required){% endif %}
    {% if key in secret_fields %}
      <span>Protected configuration value; not displayed.</span>
    {% elif value is boolean %}
      <select name="{{ key }}" {% if key in restart_fields %}disabled{% endif %}>
        <option value="on" {% if value %}selected{% endif %}>Enabled</option>
        <option value="off" {% if not value %}selected{% endif %}>Disabled</option>
      </select>
    {% elif value is mapping %}
      <textarea name="{{ key }}" rows="4" {% if key in restart_fields %}disabled{% endif %}>{{ value|tojson }}</textarea>
    {% elif value is iterable and value is not string %}
      <input name="{{ key }}" value="{{ value|join(',') }}" {% if key in restart_fields %}disabled{% endif %}>
    {% else %}
      <input name="{{ key }}" value="{{ '' if key == 'freshness_seconds' and value is none else value }}" {% if key == 'freshness_seconds' %}placeholder="blank uses schedule-derived age"{% endif %} {% if key in restart_fields %}disabled{% endif %}>
    {% endif %}
    </label>
  {% endfor %}
  <button>Save options</button>
</form>
{% endblock %}
